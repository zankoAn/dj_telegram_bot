site_name: dj_telegram_bot
site_description: The fastest way to build a production-ready Telegram bot on Django.
site_url: https://zankoan.github.io/dj_telegram_bot/
repo_url: https://github.com/zankoAn/dj_telegram_bot
repo_name: zankoAn/dj_telegram_bot

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Guide:
      - Handlers: handlers.md
      - Examples: examples.md
      - Handler object: handler-object.md
      - User model: users.md
      - Before handlers: before-handlers.md
      - Access control: access-control.md
      - Messages & keyboards: admin.md
      - Telegram client: bot-api.md
  - Upgrading:
      - Migration guide: migration.md
      - Changelog: changelog.md
