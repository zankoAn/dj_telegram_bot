[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-tg-bot"
version = "0.1.0"
description = "A Django app for building Telegram bots"
authors = [
  { name = "zankoAN", email = "zankoAn4@gmail.com" }
]
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "django>=6.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "django-stubs>=6.0",
]

[project.urls]
Homepage = "https://github.com/zankoAn/django-tg-bot"
Repository = "https://github.com/zankoAn/django-tg-bot"

[tool.hatch.build.targets.wheel]
packages = ["django_tg_bot"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
